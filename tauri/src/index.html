<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Minesweeper</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" id="app">
    <header class="hud">
      <div class="brand">MINE&middot;SWEEPER · TAURI</div>
      <div class="hud-row">
        <div class="counter" id="mines">000</div>
        <button class="face" id="face" title="New game">🙂</button>
        <div class="counter" id="timer">000</div>
      </div>
      <div class="presets">
        <button data-preset="beginner" class="active">Beginner</button>
        <button data-preset="intermediate">Intermediate</button>
        <button data-preset="expert">Expert</button>
        <button data-preset="custom">Custom…</button>
      </div>
    </header>
    <section class="board-wrap">
      <div class="board" id="board"></div>
      <div class="banner" id="banner" hidden></div>
    </section>
    <footer class="hint">
      Left-click reveal · Right-click flag · Middle-click (or both buttons) chord
    </footer>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
